<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위아래 버튼</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      background-color: #ff0;
    }

    /* 위로 아래로 버튼 */


    .go-btn {
      position: fixed;
      right: 0;
      bottom: 100px;
      z-index: 1000;
    }

    .go-btn>a {
      display: block;
      width: 40px;
      height: 40px;
      padding: 0;
    }

    .go-btn .btn-wrap {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      background-color: #000;
    }

    .go-btn img {
      display: inline-block;
      width: 25px;
      padding: 10px;
      background-color: #000;
    }
  </style>
</head>

<body>
  <div class="go-btn">
    <a href="#">
      <div class="btn-wrap up"><img src="/newfolder/images/bt_up.png" alt=""></div>
    </a>
    <a href="#footer">
      <div class="btn-wrap down"><img src="/newfolder/images/bt_down.png" alt=""></div>
    </a>
    <a href="https://pf.kakao.com/_TsIAE" target="_blank">
      <div class="btn-wrap kakao"><img src="/newfolder/images/icon_kakao.jpg" alt=""></div>
    </a>
  </div>
</body>

</html>
