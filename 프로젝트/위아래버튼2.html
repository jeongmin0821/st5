<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* --- 퀵 메뉴 --- */

/* 1. 버튼 3개를 감싸는 컨테이너 */
.quick-menu {
    position: fixed; /* 화면 스크롤과 상관없이 항상 고정 */
    right: 20px;     /* 화면 오른쪽에서 20px 떨어짐 */
    bottom: 30px;    /* 화면 아래쪽에서 30px 떨어짐 */
    z-index: 1000;   /* 다른 요소들보다 항상 위에 있도록 설정 */
    
    display: flex;        /* 버튼들을 유연하게 배치 */
    flex-direction: column; /* 버튼들을 세로로 쌓음 */
    gap: 10px;            /* 버튼 사이의 간격 */
}

/* 2. 개별 버튼 (a 태그) 스타일 */
.quick-menu a {
    display: block;
    width: 45px;  /* 버튼 너비 */
    height: 45px; /* 버튼 높이 */
    
    /* (선택) 버튼 배경색 및 테두리 */
    background-color: rgba(0, 0, 0, 0.5); /* 50% 투명한 검은 배경 */
    border-radius: 50%; /* 버튼을 원형으로 만듦 */
    
    /* (선택) 부드러운 전환 효과 */
    transition: background-color 0.2s ease;
}

/* 3. (선택) 마우스를 올렸을 때 버튼 배경을 더 진하게 */
.quick-menu a:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

/* 4. 버튼 안의 이미지 (img 태그) 스타일 */
.quick-menu a img {
    width: 100%;  /* 이미지 너비를 버튼에 꽉 채움 */
    height: 100%; /* 이미지 높이를 버튼에 꽉 채움 */
    
    /* 이미지가 찌그러지지 않고 비율을 유지하도록 */
    object-fit: contain; 
    
    /* (선택) 아이콘이 너무 꽉 차 보이면 padding을 줍니다 */
    padding: 10px;
    box-sizing: border-box; /* 패딩이 크기에 영향을 주지 않도록 */
}
  </style>
</head>
<body>
  <div class="quick-menu">
    <a href="javascript:void(0);" id="scroll-top">
        <img src="/web/upload/icon/up-arrow.png" alt="맨 위로">
    </a>
    
    <a href="javascript:void(0);" id="scroll-bottom">
        <img src="/web/upload/icon/down-arrow.png" alt="맨 아래로">
    </a>
    
    <a href="YOUR_CHAT_LINK_HERE" id="chat-link" target="_blank">
        <img src="/web/upload/icon/chat-bubble.png" alt="채팅 문의">
    </a>
</div>
</body>
</html>
